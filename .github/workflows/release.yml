name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without a leading v
        required: true
        type: string
      publish_unsigned_prerelease:
        description: Publish the verified unsigned candidate as a prerelease
        required: true
        default: false
        type: boolean

concurrency:
  group: qsearch-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unsigned-candidate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.404

      - name: Enforce owner-only publication
        if: ${{ inputs.publish_unsigned_prerelease && (github.actor != github.repository_owner || github.triggering_actor != github.repository_owner) }}
        shell: pwsh
        run: throw 'Only the repository owner may publish an unsigned prerelease.'

      - name: Restore, build, and test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore Qsearch.slnx
          dotnet format Qsearch.slnx --verify-no-changes --no-restore
          dotnet build Qsearch.slnx -c Release --no-restore -warnaserror
          dotnet test Qsearch.slnx -c Release --no-build
          dotnet run --project src/Qsearch.Benchmarks/Qsearch.Benchmarks.csproj -c Release --no-build -- --smoke --output work/benchmarks/smoke.json

      - name: Build and verify unsigned candidate
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:RELEASE_VERSION
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?$') {
            throw 'Invalid release version.'
          }
          $portable = "outputs/Qsearch-$version-win-x64-portable.zip"
          $slim = "outputs/Qsearch-$version-win-x64-slim.zip"
          ./packaging/build-portable.ps1 -Version $version -OutputDirectory outputs -SourceRevision $env:SOURCE_REVISION
          ./packaging/build-slim.ps1 -Version $version -OutputDirectory outputs -SourceRevision $env:SOURCE_REVISION
          ./packaging/verify-package.ps1 -Package $portable -ExpectedVersion $version -ExpectedRevision $env:SOURCE_REVISION
          ./packaging/verify-package.ps1 -Package $slim -ExpectedVersion $version -ExpectedRevision $env:SOURCE_REVISION
          $env:QSEARCH_TEST_PACKAGE = (Resolve-Path $portable)
          $env:QSEARCH_TEST_SLIM_PACKAGE = (Resolve-Path $slim)
          dotnet test tests/Qsearch.Architecture.Tests/Qsearch.Architecture.Tests.csproj -c Release --no-build

      - name: Upload unsigned candidate for owner review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Qsearch-${{ inputs.version }}-unsigned
          path: |
            outputs/*
            work/benchmarks/smoke.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish-prerelease:
    if: ${{ inputs.publish_unsigned_prerelease && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
    needs: unsigned-candidate
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified unsigned candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Qsearch-${{ inputs.version }}-unsigned
          path: work/release-candidate

      - name: Publish verified unsigned prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          function Invoke-GhJson {
            param(
              [Parameter(Mandatory = $true)]
              [string[]]$Arguments,
              [Parameter(Mandatory = $true)]
              [string]$FailureMessage
            )

            $output = @(& gh @Arguments)
            if ($LASTEXITCODE -ne 0) {
              throw $FailureMessage
            }

            $json = [string]::Join("`n", [string[]]$output)
            try {
              return $json | ConvertFrom-Json
            }
            catch {
              throw "$FailureMessage GitHub returned invalid JSON."
            }
          }

          function Get-ExactTagReference {
            param([Parameter(Mandatory = $true)][string]$Tag)

            $references = @(
              Invoke-GhJson `
                -Arguments @('api', "repos/$repository/git/matching-refs/tags/$tag") `
                -FailureMessage "Tag lookup failed: $Tag"
            )
            $exact = @($references | Where-Object { $_.ref -ceq "refs/tags/$Tag" })
            if ($exact.Count -gt 1) {
              throw "More than one exact tag reference was returned: $Tag"
            }
            if ($exact.Count -eq 0) {
              return $null
            }
            return $exact[0]
          }

          function Resolve-TagCommit {
            param([Parameter(Mandatory = $true)][string]$Tag)

            $reference = Get-ExactTagReference -Tag $Tag
            if ($null -eq $reference) {
              return $null
            }

            $objectType = [string]$reference.object.type
            $objectSha = [string]$reference.object.sha
            for ($depth = 0; $objectType -eq 'tag' -and $depth -lt 10; $depth++) {
              $tagObject = Invoke-GhJson `
                -Arguments @('api', "repos/$repository/git/tags/$objectSha") `
                -FailureMessage "Annotated tag lookup failed: $Tag"
              $objectType = [string]$tagObject.object.type
              $objectSha = [string]$tagObject.object.sha
            }

            if ($objectType -ne 'commit') {
              throw "Tag does not resolve to a commit: $Tag"
            }
            return $objectSha
          }

          function Get-ReleaseByTag {
            param([Parameter(Mandatory = $true)][string]$Tag)

            $releasePages = @(
              Invoke-GhJson `
                -Arguments @('api', '--paginate', '--slurp', "repos/$repository/releases?per_page=100") `
                -FailureMessage 'Authenticated release listing failed.'
            )
            $releases = @($releasePages | ForEach-Object { @($_) })
            $matches = @($releases | Where-Object { $_.tag_name -ceq $Tag })
            if ($matches.Count -gt 1) {
              throw "More than one release uses tag $Tag."
            }
            if ($matches.Count -eq 0) {
              return $null
            }
            return $matches[0]
          }

          function Confirm-ZipChecksum {
            param(
              [Parameter(Mandatory = $true)][string]$ZipPath,
              [Parameter(Mandatory = $true)][string]$ChecksumPath
            )

            $checksumText = (Get-Content -LiteralPath $ChecksumPath -Raw).Trim()
            if ($checksumText -notmatch '^([0-9a-fA-F]{64})\s+\*?(.+)$') {
              throw "Invalid SHA-256 file: $ChecksumPath"
            }
            $expectedHash = $Matches[1].ToLowerInvariant()
            $expectedName = $Matches[2].Trim()
            $actualName = Split-Path -Leaf $ZipPath
            if ($expectedName -cne $actualName) {
              throw "SHA-256 filename mismatch: $ChecksumPath"
            }
            $actualHash = (Get-FileHash -LiteralPath $ZipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              throw "SHA-256 mismatch: $ZipPath"
            }
            return $actualHash
          }

          $version = $env:RELEASE_VERSION
          $sourceRevision = $env:SOURCE_REVISION.ToLowerInvariant()
          $repository = $env:GITHUB_REPOSITORY
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?$') {
            throw 'Invalid release version.'
          }
          if ($sourceRevision -notmatch '^[0-9a-f]{40}$') {
            throw 'Invalid source revision.'
          }
          if ($repository -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw 'Invalid repository identifier.'
          }

          $tag = "v$version"
          $title = "Qsearch v$version"
          $notes = "docs/releases/$tag.md"
          $outputRoot = 'work/release-candidate/outputs'
          $portable = "$outputRoot/Qsearch-$version-win-x64-portable.zip"
          $slim = "$outputRoot/Qsearch-$version-win-x64-slim.zip"
          $assets = @($portable, "$portable.sha256", $slim, "$slim.sha256")
          $expectedAssetNames = @($assets | ForEach-Object { Split-Path -Leaf $_ })

          foreach ($path in @($notes) + $assets) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required release file was not found: $path"
            }
          }
          if ((Get-Content -LiteralPath $notes -Raw) -notmatch '(?i)Unsigned preview') {
            throw 'Release notes must contain the Unsigned preview warning.'
          }

          Confirm-ZipChecksum `
            -ZipPath $portable `
            -ChecksumPath "$portable.sha256" | Out-Null
          Confirm-ZipChecksum `
            -ZipPath $slim `
            -ChecksumPath "$slim.sha256" | Out-Null
          $localHashes = @{}
          foreach ($assetPath in $assets) {
            $localHashes[(Split-Path -Leaf $assetPath)] =
              (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          }

          $tagCommit = Resolve-TagCommit -Tag $tag
          if ($null -ne $tagCommit -and $tagCommit -ne $sourceRevision) {
            throw "Tag $tag already points to a different commit."
          }

          $release = Get-ReleaseByTag -Tag $tag
          if ($null -ne $release) {
            if (-not [bool]$release.draft) {
              throw "Release $tag is already published."
            }
            $unexpectedAssets = @(
              @($release.assets) |
                Where-Object { $_.name -cnotin $expectedAssetNames } |
                ForEach-Object { $_.name }
            )
            if ($unexpectedAssets.Count -gt 0) {
              throw "Release asset set mismatch: unexpected existing assets: $($unexpectedAssets -join ', ')"
            }
          }
          else {
            & gh release create $tag `
              --repo $repository `
              --target $sourceRevision `
              --title $title `
              --notes-file $notes `
              --draft `
              --prerelease `
              --latest=false
            if ($LASTEXITCODE -ne 0) { throw "Draft release creation failed: $tag" }
          }

          & gh release edit $tag `
            --repo $repository `
            --target $sourceRevision `
            --title $title `
            --notes-file $notes `
            --draft `
            --prerelease `
            --latest=false
          if ($LASTEXITCODE -ne 0) { throw "Draft release update failed: $tag" }

          $uploadArguments = @('release', 'upload', $tag) + $assets + @('--repo', $repository, '--clobber')
          & gh @uploadArguments
          if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed: $tag" }

          $release = Get-ReleaseByTag -Tag $tag
          if ($null -eq $release -or -not [bool]$release.draft) {
            throw "Draft release state verification failed: $tag"
          }
          $actualAssetNames = @(@($release.assets) | ForEach-Object { [string]$_.name } | Sort-Object)
          $expectedSortedNames = @($expectedAssetNames | Sort-Object)
          if (($actualAssetNames.Count -ne $expectedSortedNames.Count) -or
              (Compare-Object -ReferenceObject $expectedSortedNames -DifferenceObject $actualAssetNames -CaseSensitive)) {
            throw "Release asset set mismatch: expected exactly $($expectedSortedNames -join ', ')"
          }
          foreach ($asset in @($release.assets)) {
            $assetName = [string]$asset.name
            $expectedDigest = "sha256:$($localHashes[$assetName])"
            if ([string]$asset.digest -ne $expectedDigest) {
              throw "Release asset digest mismatch: $assetName"
            }
          }

          $tagCommit = Resolve-TagCommit -Tag $tag
          if ($null -ne $tagCommit -and $tagCommit -ne $sourceRevision) {
            throw "Tag $tag changed before publication."
          }
          if ($null -eq $tagCommit) {
            & gh api `
              --method POST `
              "repos/$repository/git/refs" `
              -f "ref=refs/tags/$tag" `
              -f "sha=$sourceRevision" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              $tagCommit = Resolve-TagCommit -Tag $tag
              if ($tagCommit -ne $sourceRevision) {
                throw "Verified tag creation failed: $tag"
              }
            }
          }
          $tagCommit = Resolve-TagCommit -Tag $tag
          if ($tagCommit -ne $sourceRevision) {
            throw "Verified tag revision mismatch: $tag"
          }

          & gh release edit $tag `
            --repo $repository `
            --target $sourceRevision `
            --title $title `
            --notes-file $notes `
            --draft=false `
            --prerelease `
            --verify-tag `
            --latest=false
          if ($LASTEXITCODE -ne 0) { throw "Prerelease publication failed: $tag" }

          $publishedRelease = Get-ReleaseByTag -Tag $tag
          if ($null -eq $publishedRelease -or [bool]$publishedRelease.draft -or -not [bool]$publishedRelease.prerelease) {
            throw "Published prerelease state verification failed: $tag"
          }
          $publishedTagCommit = Resolve-TagCommit -Tag $tag
          if ($publishedTagCommit -ne $sourceRevision) {
            throw "Published tag revision mismatch: $tag"
          }
